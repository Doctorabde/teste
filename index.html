<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .sim {
            background-color: #4CAF50;
            color: white;
        }
        .nao {
            background-color: #f44336;
            color: white;
        }
        #historico {
            margin-top: 20px;
            text-align: left;
            max-width: 400px;
            margin: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container" id="pergunta-container">
        <h2 id="pergunta">Você tá bem?</h2>
        <button class="sim" onclick="trocarPergunta()">Sim</button>
        <button class="nao" onclick="trocarPergunta()">Não</button>
    </div>
    <div id="historico">
        <h3>Histórico de Respostas</h3>
        <ul id="lista-historico"></ul>
    </div>

    <script>
        function trocarPergunta() {
            document.getElementById("pergunta").textContent = "Esse perfil do Instagram é um fake seu?";
            document.getElementById("pergunta-container").innerHTML = `
                <h2>Esse perfil do Instagram é um fake seu?</h2>
                <p><a href="https://www.instagram.com/fakexfqke?igsh=Y3k1Zjhmbm45M2d4&utm_source=qr" target="_blank">Ver perfil</a></p>
                <button class="sim" onclick="registrarResposta('Sim')">Sim</button>
                <button class="nao" onclick="registrarResposta('Não')">Não</button>
            `;
        }
        
        function registrarResposta(resposta) {
            let historico = document.getElementById("lista-historico");
            let novoItem = document.createElement("li");
            novoItem.textContent = `Fake confirmado: ${resposta}`;
            historico.appendChild(novoItem);
            
            setTimeout(() => {
                document.getElementById("pergunta-container").innerHTML = "<h2>Tá bom, só queria saber. Fica bem aí.</h2>";
            }, 500);
        }
    </script>
</body>
</html>
